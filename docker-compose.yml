services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: user_service_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/user_service_db
      SECRET_KEY: your-secret-key-change-this-later
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      - postgres
    networks:
      - ecommerce-network

  product-postgres:
    image: postgres:16
    container_name: product-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: product_service_db
    ports:
      - "5434:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@product-postgres:5432/product_service_db
    depends_on:
      - product-postgres
    networks:
      - ecommerce-network

  cart-postgres:
    image: postgres:16
    container_name: cart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: cart_service_db
    ports:
      - "5435:5432"
    volumes:
      - cart_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  cart-service:
    build: ./services/cart-service
    container_name: cart-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@cart-postgres:5432/cart_service_db
      SECRET_KEY: your-secret-key-change-this-later
      ALGORITHM: HS256
      PRODUCT_SERVICE_URL: http://product-service:8002
    depends_on:
      - cart-postgres
      - product-service
    networks:
      - ecommerce-network

  order-postgres:
    image: postgres:16
    container_name: order-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: order_service_db
    ports:
      - "5436:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@order-postgres:5432/order_service_db
      SECRET_KEY: your-secret-key-change-this-later
      ALGORITHM: HS256
      PRODUCT_SERVICE_URL: http://product-service:8002
      CART_SERVICE_URL: http://cart-service:8003
    depends_on:
      - order-postgres
      - product-service
      - cart-service
    networks:
      - ecommerce-network

  recommendation-postgres:
    image: postgres:16
    container_name: recommendation-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: recommendation_service_db
    ports:
      - "5437:5432"
    volumes:
      - recommendation_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  recommendation-service:
    build: ./services/recommendation-service
    container_name: recommendation-service
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@recommendation-postgres:5432/recommendation_service_db
      PRODUCT_SERVICE_URL: http://product-service:8002
      ORDER_SERVICE_URL: http://order-service:8004
    depends_on:
      - recommendation-postgres
      - product-service
      - order-service
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  product_postgres_data:
  cart_postgres_data:
  order_postgres_data:
  recommendation_postgres_data:

networks:
  ecommerce-network:
    driver: bridge